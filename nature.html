<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Field Observations — Alvin Liu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f8f7f4;
      --ink:       #111110;
      --muted:     #8a8880;
      --border:    #e0ddd5;
      --serif:     'Libre Baskerville', Georgia, serif;
      --mono:      'IBM Plex Mono', 'Courier New', monospace;
    }

    body {
      font-family: var(--serif);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── HEADER ─────────────────────────────── */
    .site-header {
      max-width: 1080px;
      margin: 0 auto;
      padding: 3.5rem 2rem 2.25rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--border);
    }

    .header-eyebrow {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }

    .header-name {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .header-bio {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      font-style: italic;
      color: var(--muted);
      max-width: 38ch;
    }

    .header-stats {
      display: flex;
      gap: 2.5rem;
      text-align: right;
      flex-shrink: 0;
      margin-left: 2rem;
    }

    .stat-num {
      display: block;
      font-family: var(--mono);
      font-size: 1.75rem;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .stat-label {
      display: block;
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 5px;
    }

    /* ─── FILTERS ─────────────────────────────── */
    .filters-bar {
      max-width: 1080px;
      margin: 0 auto;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .filter-prefix {
      font-family: var(--mono);
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-right: 0.4rem;
    }

    .filter-btn {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      padding: 0.3rem 0.8rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.12s, color 0.12s, background 0.12s;
    }

    .filter-btn:hover {
      border-color: var(--ink);
      color: var(--ink);
    }

    .filter-btn.active {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    /* ─── GRID ────────────────────────────────── */
    .grid-wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 1.75rem 2rem;
    }

    .obs-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    .obs-card {
      cursor: pointer;
    }

    .obs-img-wrap {
      overflow: hidden;
      background: #e5e2da;
      aspect-ratio: 1;
    }

    .obs-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease, opacity 0.2s;
    }

    .obs-card:hover .obs-img {
      transform: scale(1.04);
      opacity: 0.88;
    }

    .obs-meta {
      padding: 0.55rem 0 0;
    }

    .obs-common {
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .obs-sci {
      font-family: var(--mono);
      font-size: 0.62rem;
      font-style: italic;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .obs-date {
      font-family: var(--mono);
      font-size: 0.58rem;
      color: var(--muted);
      margin-top: 3px;
    }

    /* ─── LOAD MORE ───────────────────────────── */
    .load-more-area {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 2rem 3.5rem;
      display: flex;
      justify-content: center;
    }

    .load-btn {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      padding: 0.65rem 2.25rem;
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .load-btn:hover { background: var(--ink); color: var(--bg); }
    .load-btn:disabled { opacity: 0.4; cursor: default; }

    /* ─── STATUS MESSAGE ──────────────────────── */
    .status {
      max-width: 1080px;
      margin: 3rem auto;
      padding: 0 2rem;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
    }

    /* ─── MODAL ───────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 9, 0.72);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal-box {
      background: var(--bg);
      width: 100%;
      max-width: 860px;
      max-height: 90dvh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      position: relative;
    }

    .modal-photo {
      width: 100%;
      height: 100%;
      min-height: 320px;
      object-fit: cover;
      display: block;
      background: #e5e2da;
    }

    .modal-body {
      padding: 2rem 1.75rem;
      overflow-y: auto;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .modal-close {
      position: absolute;
      top: 0.75rem;
      right: 0.85rem;
      background: none;
      border: none;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      color: var(--bg);
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
      z-index: 10;
      padding: 0.2rem;
    }

    .modal-common {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .modal-sci {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-style: italic;
      color: var(--muted);
      margin-top: 4px;
    }

    .modal-rule {
      height: 1px;
      background: var(--border);
    }

    .meta-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .meta-item {}

    .meta-key {
      font-family: var(--mono);
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .meta-val {
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 7px;
      border: 1px solid;
    }

    .badge-research  { border-color: #2d6a2d; color: #2d6a2d; }
    .badge-needs_id  { border-color: #b06800; color: #b06800; }
    .badge-casual    { border-color: var(--muted); color: var(--muted); }

    .modal-link {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1px;
      transition: color 0.12s, border-color 0.12s;
      align-self: flex-start;
    }

    .modal-link:hover {
      color: var(--ink);
      border-color: var(--ink);
    }

    /* ─── FOOTER ──────────────────────────────── */
    .site-footer {
      max-width: 1080px;
      margin: 0 auto;
      padding: 1.25rem 2rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--muted);
    }

    .site-footer a {
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1px;
      transition: color 0.12s;
    }
    .site-footer a:hover { color: var(--ink); }

    /* ─── RESPONSIVE ──────────────────────────── */
    @media (max-width: 860px) {
      .obs-grid { grid-template-columns: repeat(3, 1fr); }
      .header-stats { gap: 1.5rem; }
    }

    @media (max-width: 640px) {
      .site-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 1.75rem;
        padding: 2.5rem 1.25rem 1.75rem;
      }
      .header-stats { text-align: left; margin-left: 0; }
      .obs-grid { grid-template-columns: repeat(2, 1fr); }
      .grid-wrap { padding: 1.25rem; }
      .filters-bar { padding: 0.85rem 1.25rem; }
      .modal-box { grid-template-columns: 1fr; }
      .modal-photo { min-height: 220px; }
      .modal-body { border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-left">
      <p class="header-eyebrow">iNaturalist · Field Observations</p>
      <h1 class="header-name">Alvin Liu</h1>
      <p class="header-bio" id="bio">Loading profile…</p>
    </div>
    <div class="header-stats" id="stats">
      <div>
        <span class="stat-num" id="stat-obs">—</span>
        <span class="stat-label">Observations</span>
      </div>
      <div>
        <span class="stat-num" id="stat-spp">—</span>
        <span class="stat-label">Species</span>
      </div>
      <div>
        <span class="stat-num" id="stat-id">—</span>
        <span class="stat-label">IDs given</span>
      </div>
    </div>
  </header>

  <nav class="filters-bar" aria-label="Filter by taxon">
    <span class="filter-prefix">Filter</span>
    <button class="filter-btn active" data-taxon="">All</button>
    <button class="filter-btn" data-taxon="Aves">Birds</button>
    <button class="filter-btn" data-taxon="Plantae">Plants</button>
    <button class="filter-btn" data-taxon="Insecta">Insects</button>
    <button class="filter-btn" data-taxon="Fungi">Fungi</button>
    <button class="filter-btn" data-taxon="Mammalia">Mammals</button>
    <button class="filter-btn" data-taxon="Reptilia">Reptiles</button>
    <button class="filter-btn" data-taxon="Amphibia">Amphibians</button>
  </nav>

  <main class="grid-wrap">
    <div class="obs-grid" id="grid" aria-label="Observations"></div>
  </main>

  <p class="status" id="status" aria-live="polite">Loading observations…</p>

  <div class="load-more-area" id="load-more-area" style="display:none">
    <button class="load-btn" id="load-btn">Load more</button>
  </div>

  <footer class="site-footer">
    <span>Data via iNaturalist API</span>
    <a href="https://www.inaturalist.org/people/officeofalvinliu" target="_blank" rel="noopener">
      View full profile ↗
    </a>
  </footer>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-label="Observation detail">
    <div class="modal-box">
      <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
      <img class="modal-photo" id="modal-photo" src="" alt="">
      <div class="modal-body">
        <div>
          <p class="modal-common" id="modal-common">—</p>
          <p class="modal-sci"    id="modal-sci">—</p>
        </div>
        <div class="modal-rule"></div>
        <div class="meta-list" id="modal-meta"></div>
        <a class="modal-link" id="modal-link" href="#" target="_blank" rel="noopener">
          View on iNaturalist ↗
        </a>
      </div>
    </div>
  </div>

  <script>
    const USER     = 'officeofalvinliu';
    const API      = 'https://api.inaturalist.org/v1';
    const PER_PAGE = 24;

    let page        = 1;
    let taxon       = '';
    let loading     = false;
    let exhausted   = false;

    const grid      = document.getElementById('grid');
    const status    = document.getElementById('status');
    const loadArea  = document.getElementById('load-more-area');
    const loadBtn   = document.getElementById('load-btn');
    const overlay   = document.getElementById('modal-overlay');

    /* ── Profile ─────────────────────────────── */
    async function loadProfile() {
      try {
        const r = await fetch(`${API}/users/${USER}`);
        const d = await r.json();
        const u = d.results?.[0];
        if (!u) return;

        const fmt = n => (n ?? 0).toLocaleString();
        document.getElementById('stat-obs').textContent = fmt(u.observations_count);
        document.getElementById('stat-spp').textContent = fmt(u.species_count);
        document.getElementById('stat-id').textContent  = fmt(u.identifications_count);

        const raw = (u.description_html || '').replace(/<[^>]+>/g, '').trim();
        document.getElementById('bio').textContent = raw || 'Naturalist & observer';
      } catch {
        document.getElementById('bio').textContent = 'Naturalist & observer';
      }
    }

    /* ── Observations ─────────────────────────── */
    async function loadObs(reset = false) {
      if (loading || exhausted) return;
      loading = true;
      loadBtn.disabled = true;
      loadBtn.textContent = 'Loading…';
      if (reset) { status.textContent = 'Loading observations…'; status.style.display = 'block'; }

      let url = `${API}/observations?user_id=${USER}&per_page=${PER_PAGE}&page=${page}&order_by=created_at&order=desc&photos=true`;
      if (taxon) url += `&iconic_taxa[]=${taxon}`;

      try {
        const r = await fetch(url);
        const d = await r.json();
        const obs = d.results || [];
        const total = d.total_results || 0;

        status.style.display = 'none';
        if (obs.length === 0 && reset) {
          status.textContent = 'No observations found for this filter.';
          status.style.display = 'block';
          loadArea.style.display = 'none';
          loading = false;
          return;
        }

        obs.forEach(renderCard);

        const loaded = (page - 1) * PER_PAGE + obs.length;
        exhausted = loaded >= total;
        loadArea.style.display = exhausted ? 'none' : 'flex';
        loadBtn.textContent  = 'Load more';
        loadBtn.disabled = false;
        page++;
      } catch {
        status.textContent = 'Failed to load. Please refresh.';
        status.style.display = 'block';
        loadBtn.disabled = false;
        loadBtn.textContent = 'Try again';
      }

      loading = false;
    }

    /* ── Card ─────────────────────────────────── */
    function renderCard(obs) {
      const photo = obs.photos?.[0];
      if (!photo) return;

      const thumb  = photo.url;
      const medium = photo.url?.replace('square', 'medium') || thumb;
      const common = obs.taxon?.preferred_common_name || obs.taxon?.name || 'Unknown';
      const sci    = obs.taxon?.name || '';
      const date   = obs.observed_on ? fmtDate(obs.observed_on) : '';

      const card = document.createElement('article');
      card.className = 'obs-card';
      card.innerHTML = `
        <div class="obs-img-wrap">
          <img class="obs-img" src="${thumb}" alt="${common}" loading="lazy">
        </div>
        <div class="obs-meta">
          <p class="obs-common">${common}</p>
          ${sci  ? `<p class="obs-sci">${sci}</p>` : ''}
          ${date ? `<p class="obs-date">${date}</p>` : ''}
        </div>
      `;
      card.addEventListener('click', () => openModal(obs, medium));
      grid.appendChild(card);
    }

    /* ── Modal ────────────────────────────────── */
    function openModal(obs, imgUrl) {
      const common  = obs.taxon?.preferred_common_name || obs.taxon?.name || 'Unknown';
      const sci     = obs.taxon?.name || '';
      const date    = obs.observed_on ? fmtDate(obs.observed_on) : null;
      const place   = obs.place_guess || null;
      const quality = obs.quality_grade || null;
      const notes   = obs.description   || null;
      const tax     = buildTaxonomy(obs.taxon);

      document.getElementById('modal-photo').src    = imgUrl;
      document.getElementById('modal-photo').alt    = common;
      document.getElementById('modal-common').textContent = common;
      document.getElementById('modal-sci').textContent    = sci;
      document.getElementById('modal-link').href          = `https://www.inaturalist.org/observations/${obs.id}`;

      const meta = document.getElementById('modal-meta');
      meta.innerHTML = '';

      const rows = [
        date    && { k: 'Observed',  v: date },
        place   && { k: 'Location',  v: place },
        quality && { k: 'Grade',     v: `<span class="badge badge-${quality}">${quality.replace('_',' ')}</span>` },
        tax     && { k: 'Taxonomy',  v: tax },
        notes   && { k: 'Notes',     v: notes },
      ].filter(Boolean);

      rows.forEach(({ k, v }) => {
        const item = document.createElement('div');
        item.className = 'meta-item';
        item.innerHTML = `<p class="meta-key">${k}</p><p class="meta-val">${v}</p>`;
        meta.appendChild(item);
      });

      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      overlay.classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('modal-close').addEventListener('click', closeModal);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    /* ── Filters ──────────────────────────────── */
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        taxon     = btn.dataset.taxon;
        page      = 1;
        exhausted = false;
        grid.innerHTML = '';
        loadArea.style.display = 'none';
        loadObs(true);
      });
    });

    loadBtn.addEventListener('click', () => loadObs(false));

    /* ── Utils ────────────────────────────────── */
    function fmtDate(str) {
      try {
        const d = new Date(str + 'T00:00:00');
        return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
      } catch { return str; }
    }

    function buildTaxonomy(taxon) {
      if (!taxon) return '';
      const parts = [];
      if (taxon.iconic_taxon_name) parts.push(taxon.iconic_taxon_name);
      if (taxon.rank && taxon.name) {
        const rank = taxon.rank.charAt(0).toUpperCase() + taxon.rank.slice(1);
        parts.push(`${rank} ${taxon.name}`);
      }
      return parts.join(' · ');
    }

    /* ── Init ─────────────────────────────────── */
    loadProfile();
    loadObs(true);
  </script>

</body>
</html>
