<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Hero</title>
  <style>
    /* ─── Reset ─────────────────────────────────────────────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* ─── Layout ─────────────────────────────────────────────────────────── */
    #hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding-left: 4rem;
    }
    #content {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* ─── Phase 1 : "I work with [ticker]" ──────────────────────────────── */
    #row1 {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: visible;
    }
    #label-work {
      font-size: 48px;
      font-weight: 500;
      color: #fff;
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 72px;
      opacity: 0;
      transform: translateX(-24px);
    }
    #ticker-wrap {
      position: relative;
      height: 360px;
      width: 620px;
      overflow: hidden;
      flex-shrink: 0;
    }
    /* fade edges of the ticker */
    #ticker-wrap::before,
    #ticker-wrap::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 130px;
      z-index: 2;
      pointer-events: none;
    }
    #ticker-wrap::before { top: 0;    background: linear-gradient(to bottom, #0a0a0a, transparent); }
    #ticker-wrap::after  { bottom: 0; background: linear-gradient(to top,    #0a0a0a, transparent); }
    #ticker-inner { position: absolute; left: 0; right: 0; }
    .tick-item {
      height: 72px;
      display: flex;
      align-items: center;
      font-size: 46px;
      font-weight: 400;
      color: #fff;
      white-space: nowrap;
      opacity: 0;
      position: absolute;
      left: 0; right: 0;
    }

    /* ─── Phase 2 : "Problems that need / Solutions" ─────────────────────── */
    #phase2 {
      display: none;
      flex-direction: column;
      gap: 2px;
    }
    #line1-wrap {
      display: flex;
      align-items: baseline;
      gap: 14px;
      min-height: 72px;
      flex-wrap: wrap;
    }
    #word-problems {
      font-size: 48px;
      font-weight: 500;
      color: #fff;
      white-space: nowrap;
      opacity: 0;
    }
    #suffix1-pre {
      font-size: 48px;
      font-weight: 400;
      color: #fff;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(18px);
    }
    #solutions-reveal {
      display: flex;
      align-items: center;
      min-height: 64px;
    }
    #word-solutions {
      font-size: 62px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      opacity: 0;
      line-height: 1.1;
    }

    /* ─── Intersection line ──────────────────────────────────────────────── */
    #intersection-wrap {
      font-size: 18px;
      font-weight: 400;
      color: #888;
      letter-spacing: 0.03em;
      white-space: nowrap;
      margin-top: 4px;
      opacity: 0;
      transform: translateY(10px);
    }
    #int-tech, #int-innov, #int-lead { color: #888; }

    /* ─── Scroll hint ────────────────────────────────────────────────────── */
    #scroll-hint {
      font-size: 12px;
      color: #666;
      letter-spacing: 0.02em;
      margin-top: 26px;
      opacity: 0;
    }
    #click-me {
      color: #888;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      transition: color 0.2s;
    }
    #click-me:hover { color: #bbb; }

    /* ─── Blinking cursor ────────────────────────────────────────────────── */
    .cursor {
      display: inline-block;
      width: 3px;
      height: 1em;
      background: #fff;
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: blink 0.9s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ─── Replay button ──────────────────────────────────────────────────── */
    #replay-btn {
      position: fixed;
      bottom: 2rem;
      left: 4rem;
      font-size: 13px;
      font-family: inherit;
      color: #555;
      background: none;
      border: 0.5px solid #333;
      border-radius: 6px;
      padding: 8px 16px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    #replay-btn:hover { color: #aaa; border-color: #555; }
  </style>
</head>
<body>

<div id="hero">
  <div id="content">

    <!-- Phase 1 -->
    <div id="row1">
      <div id="label-work">I work with</div>
      <div id="ticker-wrap">
        <div id="ticker-inner"></div>
      </div>
    </div>

    <!-- Phase 2 -->
    <div id="phase2">
      <div id="line1-wrap">
        <span id="word-problems">Problems</span>
        <span id="suffix1-pre">that need</span>
      </div>
      <div id="solutions-reveal">
        <div id="word-solutions"></div>
      </div>
      <div id="intersection-wrap">
        at the intersection of
        <span id="int-tech">technology</span>,
        <span id="int-innov">innovation</span>, and
        <span id="int-lead">leadership.</span>
      </div>
      <div id="scroll-hint">
        scroll down to learn more, or <span id="click-me">click me</span> to view projects!
      </div>
    </div>

  </div>
</div>


<script>
  // ─── Config ──────────────────────────────────────────────────────────────

  const ITEMS = [
    'Software', 'UI/UX Design', 'Customer Discovery',
    'Intellectual Property', 'Public Speaking', 'Data Science',
    'Market Research', 'Problems',
  ];

  const ITEM_H     = 72;
  const WRAP_H     = 360;
  const CENTER_PX  = WRAP_H / 2 - ITEM_H / 2;
  const ANIM_MS    = 320;
  const HOLD_MS    = 180;
  const ERASE_SPD  = 34;
  const TYPE_SPD   = 80;

  const RED    = '#E24B4A';
  const BLUE   = '#378ADD';
  const PURPLE = '#A855F7';
  const GOLD   = '#F59E0B';

  // ─── Helpers ─────────────────────────────────────────────────────────────

  let running  = false;
  let domItems = [];

  const sleep    = ms  => new Promise(r => setTimeout(r, ms));
  const lerp     = (a, b, t) => a + (b - a) * t;
  const easeOut  = t   => 1 - Math.pow(1 - t, 3);
  const easeSettle = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

  function animate(dur, fn) {
    return new Promise(resolve => {
      const start = performance.now();
      (function frame(now) {
        const t = Math.min((now - start) / dur, 1);
        fn(t);
        t < 1 ? requestAnimationFrame(frame) : resolve();
      })(performance.now());
    });
  }

  // ─── Distance → visual property mappings ─────────────────────────────────

  function distToOpacity(dist) {
    return Math.max(0, Math.pow(Math.max(0, 1 - dist / 3.5), 1.6));
  }
  function distToWeight(dist) {
    return Math.round(lerp(700, 400, Math.min(1, dist)));
  }
  function distToSize(dist) {
    return lerp(50, 44, Math.min(1, dist));
  }

  // ─── Ticker helpers ───────────────────────────────────────────────────────

  function snapPositions(ci) {
    domItems.forEach((el, i) => {
      const dist = Math.abs(i - ci);
      el.style.top        = (CENTER_PX + (i - ci) * ITEM_H) + 'px';
      el.style.opacity    = distToOpacity(dist);
      el.style.fontWeight = distToWeight(dist);
      el.style.fontSize   = distToSize(dist) + 'px';
    });
  }

  function scrollToIndex(ci) {
    return new Promise(resolve => {
      const prev  = ci - 1;
      const start = performance.now();

      (function frame(now) {
        const t = Math.min((now - start) / ANIM_MS, 1);
        const e = easeSettle(t);

        domItems.forEach((el, i) => {
          const yFrom     = CENTER_PX + (i - prev) * ITEM_H;
          const yTo       = CENTER_PX + (i - ci)   * ITEM_H;
          const distFrom  = Math.abs(i - prev);
          const distTo    = Math.abs(i - ci);

          el.style.top        = lerp(yFrom, yTo, e) + 'px';
          el.style.opacity    = lerp(distToOpacity(distFrom), distToOpacity(distTo), e);
          el.style.fontWeight = Math.round(lerp(distToWeight(distFrom), distToWeight(distTo), e));
          el.style.fontSize   = lerp(distToSize(distFrom),   distToSize(distTo),   e) + 'px';
        });

        t < 1 ? requestAnimationFrame(frame) : (snapPositions(ci), resolve());
      })(performance.now());
    });
  }

  async function typeText(el, text, speed, cursor) {
    let typed = '';
    for (const char of text) {
      if (!running) return;
      typed += char;
      el.textContent = typed;
      if (cursor) el.appendChild(cursor);
      await sleep(speed + Math.random() * 18);
    }
  }

  async function eraseLabel() {
    const el = document.getElementById('label-work');
    let text = el.textContent;
    while (text.length > 0 && running) {
      text = text.slice(0, -1);
      el.textContent = text;
      await sleep(ERASE_SPD + Math.random() * 14);
    }
  }

  // ─── Color helpers ────────────────────────────────────────────────────────

  function hexToRgb(hex) {
    return [
      parseInt(hex.slice(1, 3), 16),
      parseInt(hex.slice(3, 5), 16),
      parseInt(hex.slice(5, 7), 16),
    ];
  }

  function animateColor(el, fromHex, toHex, dur) {
    const [r1, g1, b1] = hexToRgb(fromHex);
    const [r2, g2, b2] = hexToRgb(toHex);
    return animate(dur, t => {
      const e = easeOut(t);
      el.style.color = `rgb(
        ${Math.round(lerp(r1, r2, e))},
        ${Math.round(lerp(g1, g2, e))},
        ${Math.round(lerp(b1, b2, e))}
      )`;
    });
  }

  function getComputedHex(el) {
    const [r, g, b] = getComputedStyle(el).color.match(/\d+/g);
    return '#' + [r, g, b].map(v => parseInt(v).toString(16).padStart(2, '0')).join('');
  }

  // ─── Main animation ───────────────────────────────────────────────────────

  async function startAnimation() {
    running = false;
    await sleep(60);
    running = true;

    // DOM refs
    const wrap       = document.getElementById('ticker-wrap');
    const inner      = document.getElementById('ticker-inner');
    const labelEl    = document.getElementById('label-work');
    const phase2     = document.getElementById('phase2');
    const row1       = document.getElementById('row1');
    const wpEl       = document.getElementById('word-problems');
    const s1pre      = document.getElementById('suffix1-pre');
    const wsEl       = document.getElementById('word-solutions');
    const intWrap    = document.getElementById('intersection-wrap');
    const scrollHint = document.getElementById('scroll-hint');

    // ── Reset state ──
    wrap.style.opacity        = '1';
    wrap.style.transition     = '';
    labelEl.style.opacity     = '0';
    labelEl.style.transform   = 'translateX(-24px)';
    labelEl.style.transition  = '';
    phase2.style.display      = 'none';
    row1.style.display        = 'flex';
    inner.innerHTML           = '';
    domItems                  = [];
    wsEl.innerHTML            = '';
    wsEl.style.opacity        = '0';
    wpEl.style.opacity        = '0';
    wpEl.style.color          = '';
    s1pre.style.opacity       = '0';
    s1pre.style.transform     = 'translateY(18px)';
    intWrap.innerHTML         = 'at the intersection of <span id="int-tech">technology</span>, <span id="int-innov">innovation</span>, and <span id="int-lead">leadership</span>';
    intWrap.style.opacity     = '0';
    intWrap.style.transform   = 'translateY(10px)';
    scrollHint.style.opacity  = '0';

    // Build ticker DOM items (all offscreen and invisible)
    ITEMS.forEach(text => {
      const el = document.createElement('div');
      el.className   = 'tick-item';
      el.textContent = '';
      el.style.cssText = 'position:absolute; left:0; right:0; opacity:0;';
      inner.appendChild(el);
      domItems.push(el);
    });
    domItems.forEach((el, i) => {
      el.style.top     = (CENTER_PX + i * ITEM_H) + 'px';
      el.style.opacity = '0';
    });

    await sleep(400);

    // ── 1. "I work with" slides in ──
    labelEl.style.transition = 'opacity 500ms ease, transform 500ms ease';
    labelEl.style.opacity    = '1';
    labelEl.style.transform  = 'translateX(0)';
    await sleep(560);
    labelEl.style.transition = '';
    await sleep(120);

    // ── 2. Type "Software" at center ──
    const centerEl = domItems[0];
    centerEl.style.opacity    = '1';
    centerEl.style.fontWeight = '500';
    centerEl.style.top        = CENTER_PX + 'px';
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    await typeText(centerEl, ITEMS[0], TYPE_SPD, cursor);
    await sleep(400);
    cursor.remove();

    // ── 3. Neighbours drift in ──
    for (let i = 1; i < ITEMS.length; i++) domItems[i].textContent = ITEMS[i];

    const d1 = domItems[1];
    d1.style.top = (CENTER_PX + ITEM_H) + 'px';
    animate(500, t => { d1.style.opacity = distToOpacity(1) * easeOut(t); });
    await sleep(80);

    const d2 = domItems[2];
    d2.style.top = (CENTER_PX + 2 * ITEM_H) + 'px';
    await animate(500, t => { d2.style.opacity = distToOpacity(2) * easeOut(t); });
    await sleep(250);

    // ── 4. Scroll through all items except Problems ──
    for (let i = 1; i < ITEMS.length - 1; i++) {
      if (!running) return;
      await scrollToIndex(i);
      await sleep(HOLD_MS);
    }

    // ── 5. Scroll to "Problems" — color shifts red simultaneously ──
    const lastIdx    = ITEMS.length - 1;
    const problemsEl = domItems[lastIdx];
    animateColor(problemsEl, getComputedHex(problemsEl), RED, ANIM_MS);
    await scrollToIndex(lastIdx);
    await sleep(500);

    // ── 6. Fade out neighbours + erase label ──
    const others = domItems.filter((_, i) => i !== lastIdx);
    await Promise.all([
      eraseLabel(),
      animate(400, t => {
        others.forEach(el => {
          const d = Math.abs(domItems.indexOf(el) - lastIdx);
          el.style.opacity = distToOpacity(d) * (1 - easeOut(t));
        });
      }),
    ]);

    // ── 7. FLIP: slide "Problems" from ticker position into phase2 ──
    const fromRect = problemsEl.getBoundingClientRect();

    row1.style.display   = 'none';
    wrap.style.opacity   = '0';
    phase2.style.display = 'flex';
    wpEl.style.color     = RED;
    wpEl.style.opacity   = '0';

    wpEl.getBoundingClientRect(); // force reflow
    const toRect = wpEl.getBoundingClientRect();

    const overlay = document.createElement('div');
    overlay.textContent  = 'Problems';
    overlay.style.cssText = [
      'position:fixed', 'z-index:999', 'pointer-events:none',
      'margin:0', 'padding:0', 'white-space:nowrap', 'line-height:72px',
      'font-size:48px', 'font-weight:500', 'font-family:inherit',
      `color:${RED}`,
      `left:${fromRect.left}px`,
      `top:${fromRect.top}px`,
    ].join(';');
    document.body.appendChild(overlay);

    await animate(420, t => {
      const e = easeOut(t);
      overlay.style.left = lerp(fromRect.left, toRect.left, e) + 'px';
      overlay.style.top  = lerp(fromRect.top,  toRect.top,  e) + 'px';
    });

    wpEl.style.opacity = '1';
    overlay.remove();
    await sleep(80);

    // ── 8. "that need" fades up ──
    await animate(380, t => {
      const e = easeOut(t);
      s1pre.style.opacity   = e;
      s1pre.style.transform = `translateY(${18 * (1 - e)}px)`;
    });
    await sleep(30);

    // ── 9. "Solutions" — letter-by-letter stagger ──
    const SOLUTIONS_TEXT = 'Solutions';
    const LETTER_DUR     = 480;
    const STAGGER        = 54;

    const letterSpans = SOLUTIONS_TEXT.split('').map(char => {
      const span = document.createElement('span');
      span.textContent  = char;
      span.style.cssText = 'display:inline-block; opacity:0; transform:translateY(30px);';
      wsEl.appendChild(span);
      return span;
    });
    wsEl.style.opacity = '1';
    await sleep(20);

    letterSpans.forEach((span, i) => {
      setTimeout(() => {
        animate(LETTER_DUR, t => {
          const e = easeOut(t);
          span.style.opacity   = e;
          span.style.transform = `translateY(${30 * (1 - e)}px)`;
        });
      }, i * STAGGER);
    });
    await sleep(LETTER_DUR + SOLUTIONS_TEXT.length * STAGGER + 100);

    // ── 10. Intersection: type gibberish → left-to-right decrypt ──
    const FULL_TEXT   = 'at the intersection of technology, innovation, and leadership.';
    const GLYPH_POOL  = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*-_=+[];:\'",./<>?~`';
    const SCAN_WINDOW = 5;
    const randGlyph   = () => GLYPH_POOL[Math.floor(Math.random() * GLYPH_POOL.length)];

    // Replace intWrap content with a single display span for this phase
    intWrap.innerHTML = '<span id="crypt-display" style="color:#888"></span>';
    const cryptDisplay = document.getElementById('crypt-display');

    // Fade + slide intWrap in
    await animate(200, t => {
      const e = easeOut(t);
      intWrap.style.opacity   = e;
      intWrap.style.transform = `translateY(${10 * (1 - e)}px)`;
    });

    // Type out gibberish at typing speed
    const gibberish = Array.from(FULL_TEXT, () => randGlyph());
    for (let i = 0; i < FULL_TEXT.length; i++) {
      cryptDisplay.textContent = gibberish.slice(0, i + 1).join('');
      await sleep(14 + Math.random() * 10);
    }
    await sleep(380);

    // Decrypt left to right: clean | 4-5 scrambling chars | still-encrypted
    for (let head = 0; head <= FULL_TEXT.length + SCAN_WINDOW; head++) {
      cryptDisplay.textContent = FULL_TEXT.split('').map((_, j) => {
        if (j < head - SCAN_WINDOW) return FULL_TEXT[j]; // clean
        if (j < head)               return randGlyph();   // scrambling window
        return gibberish[j];                              // still encrypted
      }).join('');
      await sleep(26);
    }

    // Restore span structure for keyword highlights
    intWrap.innerHTML = 'at the intersection of <span id="int-tech">technology</span>, <span id="int-innov">innovation</span>, and <span id="int-lead">leadership.</span>';
    await sleep(200);

    // ── 11. Scroll hint fades in shortly after decrypt finishes ──
    sleep(150).then(() =>
      animate(420, t => { scrollHint.style.opacity = easeOut(t) * 0.85; })
    );

    // ── 12. Highlight each keyword in sequence ──
    async function highlightKeyword(el, fromHex, toHex) {
      await animateColor(el, fromHex, toHex, 420);
      await sleep(480);
      await animateColor(el, toHex, '#999', 580);
    }

    await sleep(280);
    await highlightKeyword(document.getElementById('int-tech'),  '#888', BLUE);
    await sleep(60);
    await highlightKeyword(document.getElementById('int-innov'), '#888', PURPLE);
    await sleep(60);
    await highlightKeyword(document.getElementById('int-lead'),  '#888', GOLD);
  }

  startAnimation();
</script>
</body>
</html>
